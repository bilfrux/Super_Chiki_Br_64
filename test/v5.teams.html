<!DOCTYPE html>

<html>
<head>
  <title>Javascript Racer - v5 (teams)</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <link href="common.css" rel="stylesheet" type="text/css" />
  <style>
    /* MONAD GRAND PRIX - step: 4 teams identification (additive only, does not touch common.css) */
    #teams           { position: absolute; z-index: 2; top: 36px; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 4px 0; font-family: Verdana, Geneva, sans-serif; font-weight: bold; font-size: 0.85em; box-sizing: border-box; pointer-events: none; }
    #teams .team     { padding: 4px 10px; border-radius: 4px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    #teams .team-red    { background-color: rgba(229, 57, 53, 0.85); }
    #teams .team-blue   { background-color: rgba(30, 136, 229, 0.85); }
    #teams .team-green  { background-color: rgba(67, 160, 71, 0.85); }
    #teams .team-yellow { background-color: rgba(253, 216, 53, 0.85); color: #333; text-shadow: none; }

    /* MONAD GRAND PRIX - step: fullscreen race, no tweak UI (overrides common.css, does not edit it) */
    html, body    { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    #racer        { position: fixed; inset: 0; width: 100vw; height: 100vh; margin: 0; border: none; }
    #canvas       { position: absolute; inset: 0; width: 100%; height: 100%; }
    #mute         { position: fixed; right: 16px; bottom: 16px; margin-left: 0; z-index: 3; }

    /* MONAD GRAND PRIX - step: setup (team count -> color -> countdown) */
    #setup-overlay {
      position: absolute; inset: 0; z-index: 5;
      background: rgba(6, 6, 14, 0.88); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    #setup-overlay.hidden { display: none; }
    #setup-overlay .hidden { display: none; }
    #setup-overlay h1 { font-size: 2.2em; margin: 0 0 6px; letter-spacing: 0.03em; }
    #setup-overlay p  { font-size: 1.2em; opacity: 0.85; margin: 0 0 26px; }
    .option-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; max-width: 640px; }
    .count-btn, .color-btn {
      appearance: none; border: none; border-radius: 16px; cursor: pointer;
      color: #fff; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.35);
    }
    .count-btn  { width: 84px; height: 84px; font-size: 1.8em; background: #333; }
    .count-btn:hover { background: #4a4a4a; }
    .color-btn  { min-width: 150px; padding: 26px 18px; font-size: 1.3em; }
    .color-btn.team-red    { background: #E53935; }
    .color-btn.team-blue   { background: #1E88E5; }
    .color-btn.team-green  { background: #43A047; }
    .color-btn.team-yellow { background: #FDD835; color: #2a2a08; text-shadow: none; }
    #countdown-value { font-size: 9em; font-weight: 900; text-shadow: 0 4px 18px rgba(0,0,0,0.6); }
  </style>
</head>

<body>

  <!-- dev tweak UI (nav links, resolution/lanes/road width/etc) intentionally removed for the fullscreen race -->
  <div id="fps" style="display:none"></div>

  <div id="racer">
    <div id="setup-overlay">
      <div id="setup-step-count" class="setup-step">
        <h1>🏁 MONAD GRAND PRIX</h1>
        <p>How many teams are racing?</p>
        <div class="option-row">
          <button class="count-btn" data-count="1">1</button>
          <button class="count-btn" data-count="2">2</button>
          <button class="count-btn" data-count="3">3</button>
          <button class="count-btn" data-count="4">4</button>
        </div>
      </div>
      <div id="setup-step-color" class="setup-step hidden">
        <h1>Choose your team</h1>
        <div class="option-row" id="color-options"></div>
      </div>
      <div id="setup-countdown" class="hidden">
        <div id="countdown-value">3</div>
      </div>
    </div>
    <div id="hud">
      <span id="speed"            class="hud"><span id="speed_value" class="value">0</span> mph</span>
      <span id="current_lap_time" class="hud">Time: <span id="current_lap_time_value" class="value">0.0</span></span>
      <span id="last_lap_time"    class="hud">Last Lap: <span id="last_lap_time_value" class="value">0.0</span></span>
      <span id="fast_lap_time"    class="hud">Fastest Lap: <span id="fast_lap_time_value" class="value">0.0</span></span>
    </div>
    <div id="teams">
      <span class="team team-red">🔴 RED</span>
      <span class="team team-blue">🔵 BLUE</span>
      <span class="team team-green">🟢 GREEN</span>
      <span class="team team-yellow">🟡 YELLOW</span>
    </div>
    <canvas id="canvas">
      Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
    </canvas>
    Loading...
  </div>

  <audio id='music'>
    <source src="music/racer.ogg">
    <source src="music/racer.mp3">
  </audio>
  <span id="mute"></span>

  <script src="stats.js"></script>
  <script src="common.js"></script>
  <script src="/shared/types/teams.js"></script>
  <script src="/shared/protocol/events.js"></script>
  <script src="/game/net/mgp-client.js"></script>
  <script>

    var fps            = 60;                      // how many 'update' frames per second
    var step           = 1/fps;                   // how long is each frame (in seconds)
    var width          = 1024;                    // logical canvas width
    var height         = 768;                     // logical canvas height
    var centrifugal    = 0.3;                     // centrifugal force multiplier when going around curves
    var offRoadDecel   = 0.99;                    // speed multiplier when off road (e.g. you lose 2% speed each update frame)
    var skySpeed       = 0.001;                   // background sky layer scroll speed when going around curve (or up hill)
    var hillSpeed      = 0.002;                   // background hill layer scroll speed when going around curve (or up hill)
    var treeSpeed      = 0.003;                   // background tree layer scroll speed when going around curve (or up hill)
    var skyOffset      = 0;                       // current sky scroll offset
    var hillOffset     = 0;                       // current hill scroll offset
    var treeOffset     = 0;                       // current tree scroll offset
    var segments       = [];                      // array of road segments
    var cars           = [];                      // array of cars on the road
    var stats          = Game.stats('fps');       // mr.doobs FPS counter
    var canvas         = Dom.get('canvas');       // our canvas...
    var ctx            = canvas.getContext('2d'); // ...and its drawing context
    var background     = null;                    // our background image (loaded below)
    var sprites        = null;                    // our spritesheet (loaded below)
    var resolution     = null;                    // scaling factor to provide resolution independence (computed)
    var roadWidth      = 2000;                    // actually half the roads width, easier math if the road spans from -roadWidth to +roadWidth
    var segmentLength  = 200;                     // length of a single segment
    var rumbleLength   = 3;                       // number of segments per red/white rumble strip
    var trackLength    = null;                    // z length of entire track (computed)
    var lanes          = 3;                       // number of lanes
    var fieldOfView    = 100;                     // angle (degrees) for field of view
    var cameraHeight   = 1000;                    // z height of camera
    var cameraDepth    = null;                    // z distance camera is from screen (computed)
    var drawDistance   = 300;                     // number of segments to draw
    var playerX        = 0;                       // player x offset from center of road (-1 to 1 to stay independent of roadWidth)
    var playerZ        = null;                    // player relative z distance from camera (computed)
    var fogDensity     = 5;                       // exponential fog density
    var position       = 0;                       // current camera Z position (add playerZ to get player's absolute Z position)
    var speed          = 0;                       // current speed
    var maxSpeed       = segmentLength/step;      // top speed (ensure we can't move more than 1 segment in a single frame to make collision detection easier)
    var accel          =  maxSpeed/5;             // acceleration rate - tuned until it 'felt' right
    var breaking       = -maxSpeed;               // deceleration rate when braking
    var decel          = -maxSpeed/5;             // 'natural' deceleration rate when neither accelerating, nor braking
    var offRoadDecel   = -maxSpeed/2;             // off road deceleration is somewhere in between
    var offRoadLimit   =  maxSpeed/4;             // limit when off road deceleration no longer applies (e.g. you can always go at least this speed even when off road)
    var currentLapTime = 0;                       // current lap time
    var lastLapTime    = null;                    // last lap time

    var keyFaster      = false;
    var keySlower      = false;

    var hud = {
      speed:            { value: null, dom: Dom.get('speed_value')            },
      current_lap_time: { value: null, dom: Dom.get('current_lap_time_value') },
      last_lap_time:    { value: null, dom: Dom.get('last_lap_time_value')    },
      fast_lap_time:    { value: null, dom: Dom.get('fast_lap_time_value')    }
    }

    //=========================================================================
    // MONAD GRAND PRIX - TEAMS (only new concept added in this step)
    //=========================================================================

    var TEAMS = Teams.ALL; // canonical team list, shared with Booster/BOOST/RACE_STATE/etc. - see /shared/types/teams.js

    var PLAYER_SPRITE_NAMES = ['PLAYER_LEFT', 'PLAYER_STRAIGHT', 'PLAYER_RIGHT', 'PLAYER_UPHILL_LEFT', 'PLAYER_UPHILL_STRAIGHT', 'PLAYER_UPHILL_RIGHT'];

    // MONAD GRAND PRIX - central race state (matches the RaceState type in SPEC.md section 5).
    // status: LOBBY (team pick) -> COUNTDOWN (3,2,1,GO) -> RACING. FINAL_LAP/CHAOS/FINISHED
    // are reserved here for later steps and not wired up yet.
    var RaceState = {
      status:      'LOBBY',  // "LOBBY" | "COUNTDOWN" | "RACING" | "FINAL_LAP" | "CHAOS" | "FINISHED"
      elapsed:     0,        // seconds since RACING started
      teams:       [],       // TeamState[] (shared/protocol/events.js shape), one entry per active team
      activeEvent: null      // MemeEvent | null - not used until the meme/chaos step
    };

    var teamCount   = null;     // how many of the 4 teams are racing (chosen in LOBBY)
    var playerTeam  = null;     // the TEAMS entry the human is driving (rest are bots)

    var teamCarImages    = {}; // team.id -> offscreen canvas, the CAR01 bot sprite tinted with the team color
    var teamPlayerImages = {}; // team.id -> { PLAYER_LEFT: canvas, PLAYER_STRAIGHT: canvas, ... } tinted player sprites

    function tintSprite(spriteRect, color) { // draws one spritesheet rect onto an offscreen canvas, tinted - does not touch the shared Render module
      var offscreen    = document.createElement('canvas');
      offscreen.width  = spriteRect.w;
      offscreen.height = spriteRect.h;
      var octx = offscreen.getContext('2d');
      octx.drawImage(sprites, spriteRect.x, spriteRect.y, spriteRect.w, spriteRect.h, 0, 0, spriteRect.w, spriteRect.h);
      octx.globalCompositeOperation = 'source-atop'; // tint only the pixels already drawn (keeps sprite shape/shading)
      octx.globalAlpha              = 0.6;
      octx.fillStyle                = color;
      octx.fillRect(0, 0, spriteRect.w, spriteRect.h);
      octx.globalAlpha              = 1;
      octx.globalCompositeOperation = 'source-over';
      return offscreen;
    }

    function buildTeamCarImages() { // run once sprites image has loaded
      TEAMS.forEach(function(team) {
        teamCarImages[team.id] = tintSprite(SPRITES.CAR01, team.color);

        var playerSet = {};
        PLAYER_SPRITE_NAMES.forEach(function(name) {
          playerSet[name] = tintSprite(SPRITES[name], team.color);
        });
        teamPlayerImages[team.id] = playerSet;
      });
    }

    //=========================================================================
    // MONAD GRAND PRIX - SteeringInput abstraction
    //=========================================================================
    // The single interface between "whatever controls the car" and the player car
    // physics below. The engine only ever reads SteeringInput.value (-1 full left
    // to +1 full right) - it does not know or care where that number came from.
    // Today the only source is the keyboard; later a phone gyroscope (or a
    // WebSocket DRIVER_STEER event) can call SteeringInput.set(value) instead,
    // without update()/renderPlayerCar() changing at all.

    var SteeringInput = {
      value: 0,
      set: function (value) { this.value = Util.limit(value, -1, 1); }
    };

    var KeyboardSteering = (function () {
      var left = false, right = false;
      function apply() { SteeringInput.set(left ? -1 : right ? 1 : 0); }
      return {
        setLeft:  function (down) { left  = down; apply(); },
        setRight: function (down) { right = down; apply(); }
      };
    })();

    //=========================================================================
    // UPDATE THE GAME WORLD
    //=========================================================================

    function update(dt) {

      if (Live.active) { Live.update(dt); return; } // ?live=1: the server drives the race (see the LIVE MODE block at the end)

      if (RaceState.status !== 'RACING') return; // frozen during LOBBY/COUNTDOWN - render() keeps drawing the parked scene behind the menu

      RaceState.elapsed += dt;
      updateRaceStateTeams();

      var n, car, carW, sprite, spriteW;
      var playerSegment = findSegment(position+playerZ);
      var playerW       = SPRITES.PLAYER_STRAIGHT.w * SPRITES.SCALE;
      var speedPercent  = speed/maxSpeed;
      var dx            = dt * 2 * speedPercent; // at top speed, should be able to cross from left to right (-1 to 1) in 1 second
      var startPosition = position;

      updateCars(dt, playerSegment, playerW);

      position = Util.increase(position, dt * speed, trackLength);

      playerX = playerX + (dx * SteeringInput.value); // -1 (left) / 0 / +1 (right), same effect as the old keyLeft/keyRight branch

      playerX = playerX - (dx * speedPercent * playerSegment.curve * centrifugal);

      if (keyFaster)
        speed = Util.accelerate(speed, accel, dt);
      else if (keySlower)
        speed = Util.accelerate(speed, breaking, dt);
      else
        speed = Util.accelerate(speed, decel, dt);


      if ((playerX < -1) || (playerX > 1)) {

        if (speed > offRoadLimit)
          speed = Util.accelerate(speed, offRoadDecel, dt);

        for(n = 0 ; n < playerSegment.sprites.length ; n++) {
          sprite  = playerSegment.sprites[n];
          spriteW = sprite.source.w * SPRITES.SCALE;
          if (Util.overlap(playerX, playerW, sprite.offset + spriteW/2 * (sprite.offset > 0 ? 1 : -1), spriteW)) {
            speed = maxSpeed/5;
            position = Util.increase(playerSegment.p1.world.z, -playerZ, trackLength); // stop in front of sprite (at front of segment)
            break;
          }
        }
      }

      for(n = 0 ; n < playerSegment.cars.length ; n++) {
        car  = playerSegment.cars[n];
        carW = car.sprite.w * SPRITES.SCALE;
        if (speed > car.speed) {
          if (Util.overlap(playerX, playerW, car.offset, carW, 0.8)) {
            speed    = car.speed * (car.speed/speed);
            position = Util.increase(car.z, -playerZ, trackLength);
            break;
          }
        }
      }

      playerX = Util.limit(playerX, -3, 3);     // dont ever let it go too far out of bounds
      speed   = Util.limit(speed, 0, maxSpeed); // or exceed maxSpeed

      skyOffset  = Util.increase(skyOffset,  skySpeed  * playerSegment.curve * (position-startPosition)/segmentLength, 1);
      hillOffset = Util.increase(hillOffset, hillSpeed * playerSegment.curve * (position-startPosition)/segmentLength, 1);
      treeOffset = Util.increase(treeOffset, treeSpeed * playerSegment.curve * (position-startPosition)/segmentLength, 1);

      if (position > playerZ) {
        if (currentLapTime && (startPosition < playerZ)) {
          lastLapTime    = currentLapTime;
          currentLapTime = 0;
          if (lastLapTime <= Util.toFloat(Dom.storage.fast_lap_time)) {
            Dom.storage.fast_lap_time = lastLapTime;
            updateHud('fast_lap_time', formatTime(lastLapTime));
            Dom.addClassName('fast_lap_time', 'fastest');
            Dom.addClassName('last_lap_time', 'fastest');
          }
          else {
            Dom.removeClassName('fast_lap_time', 'fastest');
            Dom.removeClassName('last_lap_time', 'fastest');
          }
          updateHud('last_lap_time', formatTime(lastLapTime));
          Dom.show('last_lap_time');
        }
        else {
          currentLapTime += dt;
        }
      }

      updateHud('speed',            5 * Math.round(speed/500));
      updateHud('current_lap_time', formatTime(currentLapTime));
    }

    //-------------------------------------------------------------------------

    // keeps RaceState.teams (position/speed) in sync each frame while RACING -
    // this is the "teams" part of the central race state, not a new physics system
    function updateRaceStateTeams() {
      var n, teamState, botCar;
      for (n = 0 ; n < RaceState.teams.length ; n++) {
        teamState = RaceState.teams[n];
        if (playerTeam && teamState.id === playerTeam.id) {
          teamState.position = position;
          teamState.speed    = speed;
        } else {
          botCar = findCarByTeamId(teamState.id);
          if (botCar) {
            teamState.position = botCar.z;
            teamState.speed    = botCar.speed;
          }
        }
      }
    }

    function findCarByTeamId(teamId) {
      for (var n = 0 ; n < cars.length ; n++) {
        if (cars[n].team && cars[n].team.id === teamId) return cars[n];
      }
      return null;
    }

    //-------------------------------------------------------------------------

    function updateCars(dt, playerSegment, playerW) {
      var n, car, oldSegment, newSegment;
      for(n = 0 ; n < cars.length ; n++) {
        car = cars[n];

        if (car.targetSpeed && (car.speed < car.targetSpeed)) // team racer cars accelerate from the grid up to race pace
          car.speed = Math.min(car.targetSpeed, car.speed + (maxSpeed/6) * dt);

        oldSegment  = findSegment(car.z);
        car.offset  = car.offset + updateCarOffset(car, oldSegment, playerSegment, playerW);
        car.z       = Util.increase(car.z, dt * car.speed, trackLength);
        car.percent = Util.percentRemaining(car.z, segmentLength); // useful for interpolation during rendering phase
        newSegment  = findSegment(car.z);
        if (oldSegment != newSegment) {
          index = oldSegment.cars.indexOf(car);
          oldSegment.cars.splice(index, 1);
          newSegment.cars.push(car);
        }
      }
    }

    function updateCarOffset(car, carSegment, playerSegment, playerW) {

      var i, j, dir, segment, otherCar, otherCarW, lookahead = 20, carW = car.sprite.w * SPRITES.SCALE;

      // optimization, dont bother steering around other cars when 'out of sight' of the player
      if ((carSegment.index - playerSegment.index) > drawDistance)
        return 0;

      for(i = 1 ; i < lookahead ; i++) {
        segment = segments[(carSegment.index+i)%segments.length];

        if ((segment === playerSegment) && (car.speed > speed) && (Util.overlap(playerX, playerW, car.offset, carW, 1.2))) {
          if (playerX > 0.5)
            dir = -1;
          else if (playerX < -0.5)
            dir = 1;
          else
            dir = (car.offset > playerX) ? 1 : -1;
          return dir * 1/i * (car.speed-speed)/maxSpeed; // the closer the cars (smaller i) and the greated the speed ratio, the larger the offset
        }

        for(j = 0 ; j < segment.cars.length ; j++) {
          otherCar  = segment.cars[j];
          otherCarW = otherCar.sprite.w * SPRITES.SCALE;
          if ((car.speed > otherCar.speed) && Util.overlap(car.offset, carW, otherCar.offset, otherCarW, 1.2)) {
            if (otherCar.offset > 0.5)
              dir = -1;
            else if (otherCar.offset < -0.5)
              dir = 1;
            else
              dir = (car.offset > otherCar.offset) ? 1 : -1;
            return dir * 1/i * (car.speed-otherCar.speed)/maxSpeed;
          }
        }
      }

      // if no cars ahead, but I have somehow ended up off road, then steer back on
      if (car.offset < -0.9)
        return 0.1;
      else if (car.offset > 0.9)
        return -0.1;
      else
        return 0;
    }

    //-------------------------------------------------------------------------

    function updateHud(key, value) { // accessing DOM can be slow, so only do it if value has changed
      if (hud[key].value !== value) {
        hud[key].value = value;
        Dom.set(hud[key].dom, value);
      }
    }

    function formatTime(dt) {
      var minutes = Math.floor(dt/60);
      var seconds = Math.floor(dt - (minutes * 60));
      var tenths  = Math.floor(10 * (dt - Math.floor(dt)));
      if (minutes > 0)
        return minutes + "." + (seconds < 10 ? "0" : "") + seconds + "." + tenths;
      else
        return seconds + "." + tenths;
    }

    //=========================================================================
    // RENDER THE GAME WORLD
    //=========================================================================

    // dispatcher: normal single view, or (?live=1&split=1) four independent
    // per-team chase cameras. Neither branch changes what renderSingleView()
    // itself does - split mode just calls it four times with different
    // position/playerX/speed and a canvas clip+transform per quadrant.
    function render() {
      if (typeof Live !== 'undefined' && Live.split) { Live.renderSplit(); return; }
      renderSingleView();
    }

    function renderSingleView() {

      var baseSegment   = findSegment(position);
      var basePercent   = Util.percentRemaining(position, segmentLength);
      var playerSegment = findSegment(position+playerZ);
      var playerPercent = Util.percentRemaining(position+playerZ, segmentLength);
      var playerY       = Util.interpolate(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);
      var maxy          = height;

      var x  = 0;
      var dx = - (baseSegment.curve * basePercent);

      ctx.clearRect(0, 0, width, height);

      Render.background(ctx, background, width, height, BACKGROUND.SKY,   skyOffset,  resolution * skySpeed  * playerY);
      Render.background(ctx, background, width, height, BACKGROUND.HILLS, hillOffset, resolution * hillSpeed * playerY);
      Render.background(ctx, background, width, height, BACKGROUND.TREES, treeOffset, resolution * treeSpeed * playerY);

      var n, i, segment, car, carSprites, carSpriteRect, sprite, spriteScale, spriteX, spriteY;

      for(n = 0 ; n < drawDistance ; n++) {

        segment        = segments[(baseSegment.index + n) % segments.length];
        segment.looped = segment.index < baseSegment.index;
        segment.fog    = Util.exponentialFog(n/drawDistance, fogDensity);
        segment.clip   = maxy;

        Util.project(segment.p1, (playerX * roadWidth) - x,      playerY + cameraHeight, position - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);
        Util.project(segment.p2, (playerX * roadWidth) - x - dx, playerY + cameraHeight, position - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);

        x  = x + dx;
        dx = dx + segment.curve;

        if ((segment.p1.camera.z <= cameraDepth)         || // behind us
            (segment.p2.screen.y >= segment.p1.screen.y) || // back face cull
            (segment.p2.screen.y >= maxy))                  // clip by (already rendered) hill
          continue;

        Render.segment(ctx, width, lanes,
                       segment.p1.screen.x,
                       segment.p1.screen.y,
                       segment.p1.screen.w,
                       segment.p2.screen.x,
                       segment.p2.screen.y,
                       segment.p2.screen.w,
                       segment.fog,
                       segment.color);

        maxy = segment.p1.screen.y;
      }

      for(n = (drawDistance-1) ; n > 0 ; n--) {
        segment = segments[(baseSegment.index + n) % segments.length];

        for(i = 0 ; i < segment.cars.length ; i++) {
          car         = segment.cars[i];
          spriteScale = Util.interpolate(segment.p1.screen.scale, segment.p2.screen.scale, car.percent);
          spriteX     = Util.interpolate(segment.p1.screen.x,     segment.p2.screen.x,     car.percent) + (spriteScale * car.offset * roadWidth * width/2);
          spriteY     = Util.interpolate(segment.p1.screen.y,     segment.p2.screen.y,     car.percent);
          if (car.team && teamCarImages[car.team.id]) {
            // team car: draw the tinted offscreen canvas instead of the shared spritesheet (Render.sprite itself is untouched)
            carSprites    = teamCarImages[car.team.id];
            carSpriteRect = { x: 0, y: 0, w: car.sprite.w, h: car.sprite.h };
          } else {
            carSprites    = sprites;
            carSpriteRect = car.sprite;
          }
          Render.sprite(ctx, width, height, resolution, roadWidth, carSprites, carSpriteRect, spriteScale, spriteX, spriteY, -0.5, -1, segment.clip);
        }

        for(i = 0 ; i < segment.sprites.length ; i++) {
          sprite      = segment.sprites[i];
          spriteScale = segment.p1.screen.scale;
          spriteX     = segment.p1.screen.x + (spriteScale * sprite.offset * roadWidth * width/2);
          spriteY     = segment.p1.screen.y;
          Render.sprite(ctx, width, height, resolution, roadWidth, sprites, sprite.source, spriteScale, spriteX, spriteY, (sprite.offset < 0 ? -1 : 0), -1, segment.clip);
        }

        if (segment == playerSegment) {
          renderPlayerCar(playerSegment, playerPercent);
        }
      }
    }

    // MONAD GRAND PRIX step: same math as the shared Render.player (common.js), but sources the
    // tinted-for-your-team offscreen canvas instead of the plain spritesheet - Render itself is untouched.
    function renderPlayerCar(playerSegment, playerPercent) {
      if (!playerTeam) return; // nothing chosen yet during SETUP - just show the empty road

      var steer     = speed * SteeringInput.value;
      var updown    = playerSegment.p2.world.y - playerSegment.p1.world.y;
      var speedPct  = speed/maxSpeed;
      var scale     = cameraDepth/playerZ;
      var destX     = width/2;
      var destY     = (height/2) - (scale * Util.interpolate(playerSegment.p1.camera.y, playerSegment.p2.camera.y, playerPercent) * height/2);
      var bounce    = (1.5 * Math.random() * speedPct * resolution) * Util.randomChoice([-1,1]);

      var spriteName;
      if (steer < 0)
        spriteName = (updown > 0) ? 'PLAYER_UPHILL_LEFT' : 'PLAYER_LEFT';
      else if (steer > 0)
        spriteName = (updown > 0) ? 'PLAYER_UPHILL_RIGHT' : 'PLAYER_RIGHT';
      else
        spriteName = (updown > 0) ? 'PLAYER_UPHILL_STRAIGHT' : 'PLAYER_STRAIGHT';

      var origRect    = SPRITES[spriteName];
      var virtualRect = { x: 0, y: 0, w: origRect.w, h: origRect.h };

      Render.sprite(ctx, width, height, resolution, roadWidth, teamPlayerImages[playerTeam.id][spriteName], virtualRect, scale, destX, destY + bounce, -0.5, -1);
    }

    function findSegment(z) {
      return segments[Math.floor(z/segmentLength) % segments.length];
    }

    //=========================================================================
    // BUILD ROAD GEOMETRY
    //=========================================================================

    function lastY() { return (segments.length == 0) ? 0 : segments[segments.length-1].p2.world.y; }

    function addSegment(curve, y) {
      var n = segments.length;
      segments.push({
          index: n,
             p1: { world: { y: lastY(), z:  n   *segmentLength }, camera: {}, screen: {} },
             p2: { world: { y: y,       z: (n+1)*segmentLength }, camera: {}, screen: {} },
          curve: curve,
        sprites: [],
           cars: [],
          color: Math.floor(n/rumbleLength)%2 ? COLORS.DARK : COLORS.LIGHT
      });
    }

    function addSprite(n, sprite, offset) {
      segments[n].sprites.push({ source: sprite, offset: offset });
    }

    function addRoad(enter, hold, leave, curve, y) {
      var startY   = lastY();
      var endY     = startY + (Util.toInt(y, 0) * segmentLength);
      var n, total = enter + hold + leave;
      for(n = 0 ; n < enter ; n++)
        addSegment(Util.easeIn(0, curve, n/enter), Util.easeInOut(startY, endY, n/total));
      for(n = 0 ; n < hold  ; n++)
        addSegment(curve, Util.easeInOut(startY, endY, (enter+n)/total));
      for(n = 0 ; n < leave ; n++)
        addSegment(Util.easeInOut(curve, 0, n/leave), Util.easeInOut(startY, endY, (enter+hold+n)/total));
    }

    var ROAD = {
      LENGTH: { NONE: 0, SHORT:  25, MEDIUM:   50, LONG:  100 },
      HILL:   { NONE: 0, LOW:    20, MEDIUM:   40, HIGH:   60 },
      CURVE:  { NONE: 0, EASY:    2, MEDIUM:    4, HARD:    6 }
    };

    function addStraight(num) {
      num = num || ROAD.LENGTH.MEDIUM;
      addRoad(num, num, num, 0, 0);
    }

    function addHill(num, height) {
      num    = num    || ROAD.LENGTH.MEDIUM;
      height = height || ROAD.HILL.MEDIUM;
      addRoad(num, num, num, 0, height);
    }

    function addCurve(num, curve, height) {
      num    = num    || ROAD.LENGTH.MEDIUM;
      curve  = curve  || ROAD.CURVE.MEDIUM;
      height = height || ROAD.HILL.NONE;
      addRoad(num, num, num, curve, height);
    }

    function addLowRollingHills(num, height) {
      num    = num    || ROAD.LENGTH.SHORT;
      height = height || ROAD.HILL.LOW;
      addRoad(num, num, num,  0,                height/2);
      addRoad(num, num, num,  0,               -height);
      addRoad(num, num, num,  ROAD.CURVE.EASY,  height);
      addRoad(num, num, num,  0,                0);
      addRoad(num, num, num, -ROAD.CURVE.EASY,  height/2);
      addRoad(num, num, num,  0,                0);
    }

    function addSCurves() {
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  -ROAD.CURVE.EASY,    ROAD.HILL.NONE);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,   ROAD.CURVE.MEDIUM,  ROAD.HILL.MEDIUM);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,   ROAD.CURVE.EASY,   -ROAD.HILL.LOW);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  -ROAD.CURVE.EASY,    ROAD.HILL.MEDIUM);
      addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  -ROAD.CURVE.MEDIUM, -ROAD.HILL.MEDIUM);
    }

    function addBumps() {
      addRoad(10, 10, 10, 0,  5);
      addRoad(10, 10, 10, 0, -2);
      addRoad(10, 10, 10, 0, -5);
      addRoad(10, 10, 10, 0,  8);
      addRoad(10, 10, 10, 0,  5);
      addRoad(10, 10, 10, 0, -7);
      addRoad(10, 10, 10, 0,  5);
      addRoad(10, 10, 10, 0, -2);
    }

    function addDownhillToEnd(num) {
      num = num || 200;
      addRoad(num, num, num, -ROAD.CURVE.EASY, -lastY()/segmentLength);
    }

    function resetRoad() {
      segments = [];

      addStraight(ROAD.LENGTH.SHORT);
      addLowRollingHills();
      addSCurves();
      addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
      addBumps();
      addLowRollingHills();
      addCurve(ROAD.LENGTH.LONG*2, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
      addStraight();
      addHill(ROAD.LENGTH.MEDIUM, ROAD.HILL.HIGH);
      addSCurves();
      addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.NONE);
      addHill(ROAD.LENGTH.LONG, ROAD.HILL.HIGH);
      addCurve(ROAD.LENGTH.LONG, ROAD.CURVE.MEDIUM, -ROAD.HILL.LOW);
      addBumps();
      addHill(ROAD.LENGTH.LONG, -ROAD.HILL.MEDIUM);
      addStraight();
      addSCurves();
      addDownhillToEnd();

      resetSprites();
      resetCars();

      segments[findSegment(playerZ).index + 2].color = COLORS.START;
      segments[findSegment(playerZ).index + 3].color = COLORS.START;
      for(var n = 0 ; n < rumbleLength ; n++)
        segments[segments.length-1-n].color = COLORS.FINISH;

      trackLength = segments.length * segmentLength;
    }

    function resetSprites() {
      var n, i;

      addSprite(20,  SPRITES.BILLBOARD07, -1);
      addSprite(40,  SPRITES.BILLBOARD06, -1);
      addSprite(60,  SPRITES.BILLBOARD08, -1);
      addSprite(80,  SPRITES.BILLBOARD09, -1);
      addSprite(100, SPRITES.BILLBOARD01, -1);
      addSprite(120, SPRITES.BILLBOARD02, -1);
      addSprite(140, SPRITES.BILLBOARD03, -1);
      addSprite(160, SPRITES.BILLBOARD04, -1);
      addSprite(180, SPRITES.BILLBOARD05, -1);

      addSprite(240,                  SPRITES.BILLBOARD07, -1.2);
      addSprite(240,                  SPRITES.BILLBOARD06,  1.2);
      addSprite(segments.length - 25, SPRITES.BILLBOARD07, -1.2);
      addSprite(segments.length - 25, SPRITES.BILLBOARD06,  1.2);

      for(n = 10 ; n < 200 ; n += 4 + Math.floor(n/100)) {
        addSprite(n, SPRITES.PALM_TREE, 0.5 + Math.random()*0.5);
        addSprite(n, SPRITES.PALM_TREE,   1 + Math.random()*2);
      }

      for(n = 250 ; n < 1000 ; n += 5) {
        addSprite(n,     SPRITES.COLUMN, 1.1);
        addSprite(n + Util.randomInt(0,5), SPRITES.TREE1, -1 - (Math.random() * 2));
        addSprite(n + Util.randomInt(0,5), SPRITES.TREE2, -1 - (Math.random() * 2));
      }

      for(n = 200 ; n < segments.length ; n += 3) {
        addSprite(n, Util.randomChoice(SPRITES.PLANTS), Util.randomChoice([1,-1]) * (2 + Math.random() * 5));
      }

      var side, sprite, offset;
      for(n = 1000 ; n < (segments.length-50) ; n += 100) {
        side      = Util.randomChoice([1, -1]);
        addSprite(n + Util.randomInt(0, 50), Util.randomChoice(SPRITES.BILLBOARDS), -side);
        for(i = 0 ; i < 20 ; i++) {
          sprite = Util.randomChoice(SPRITES.PLANTS);
          offset = side * (1.5 + Math.random());
          addSprite(n + Util.randomInt(0, 50), sprite, offset);
        }

      }

    }

    // MONAD GRAND PRIX step: exactly 4 cars, one per team, lined up ahead of the player like a starting grid
    // (replaces the v4 "200 random traffic cars" demo population - everything else about cars is unchanged)
    function resetCars() {
      cars = [];
      var startZ  = playerZ + 500; // just ahead of the player so the 4 teams are visible as soon as the game starts
      var spacing = 500;
      var offsets = [-0.75, -0.25, 0.25, 0.75]; // spread across the road width

      TEAMS.forEach(function(team, index) {
        var car = {
          offset: offsets[index],
          z:      startZ + (index * spacing),
          sprite: SPRITES.CAR01,
          speed:  maxSpeed/4,
          team:   team
        };
        var segment = findSegment(car.z);
        segment.cars.push(car);
        cars.push(car);
      });
    }

    // MONAD GRAND PRIX step: called once the player has chosen team count + color.
    // Replaces the idle preview grid with: the other (count-1) teams as racing bots
    // (accelerate to race pace, tinted, steer around traffic like any other car) plus
    // regular traffic cars/trucks as obstacles (same population logic as v4.final.html).
    function populateRaceCars(count, chosenTeamId) {
      cars = [];
      segments.forEach(function(s) { s.cars = []; }); // clear stale refs left by the idle preview grid

      var activeTeams = TEAMS.slice(0, count);
      var gridZ       = playerZ + 500;
      var gridOffsets = [-0.75, -0.25, 0.25, 0.75];

      activeTeams.forEach(function(team, index) {
        if (team.id === chosenTeamId) return; // that's the human - rendered separately, not in cars[]
        var car = {
          offset:      gridOffsets[index],
          z:           gridZ,
          sprite:      SPRITES.CAR01,
          speed:       0,
          targetSpeed: maxSpeed * (0.78 + Math.random() * 0.18), // bots ramp up to near-top speed once the race starts
          team:        team
        };
        var segment = findSegment(car.z);
        segment.cars.push(car);
        cars.push(car);
      });

      addTrafficCars(150);
    }

    // obstacle cars/trucks, same population approach as v4.final.html - shared by the local
    // mode (populateRaceCars, above) and live mode (Live.begin, below) so both have traffic.
    function addTrafficCars(count) {
      for (var n = 0 ; n < count ; n++) {
        var offset = Math.random() * Util.randomChoice([-0.8, 0.8]);
        var z      = Math.floor(Math.random() * segments.length) * segmentLength;
        var sprite = Util.randomChoice(SPRITES.CARS);
        var speed  = maxSpeed/4 + Math.random() * maxSpeed/(sprite == SPRITES.SEMI ? 4 : 2);
        var car    = { offset: offset, z: z, sprite: sprite, speed: speed };
        var segment = findSegment(car.z);
        segment.cars.push(car);
        cars.push(car);
      }
    }

    //=========================================================================
    // THE GAME LOOP
    //=========================================================================

    Game.run({
      canvas: canvas, render: render, update: update, stats: stats, step: step,
      images: ["background", "sprites"],
      keys: [
        { keys: [KEY.LEFT,  KEY.A], mode: 'down', action: function() { KeyboardSteering.setLeft(true);   } },
        { keys: [KEY.RIGHT, KEY.D], mode: 'down', action: function() { KeyboardSteering.setRight(true);  } },
        { keys: [KEY.UP,    KEY.W], mode: 'down', action: function() { keyFaster = true;  } },
        { keys: [KEY.DOWN,  KEY.S], mode: 'down', action: function() { keySlower = true;  } },
        { keys: [KEY.LEFT,  KEY.A], mode: 'up',   action: function() { KeyboardSteering.setLeft(false);  } },
        { keys: [KEY.RIGHT, KEY.D], mode: 'up',   action: function() { KeyboardSteering.setRight(false); } },
        { keys: [KEY.UP,    KEY.W], mode: 'up',   action: function() { keyFaster = false; } },
        { keys: [KEY.DOWN,  KEY.S], mode: 'up',   action: function() { keySlower = false; } }
      ],
      ready: function(images) {
        background = images[0];
        sprites    = images[1];
        buildTeamCarImages();
        reset({ width: window.innerWidth, height: window.innerHeight });
        window.racerReady = true; // LIVE MODE waits for this
        Dom.storage.fast_lap_time = Dom.storage.fast_lap_time || 180;
        updateHud('fast_lap_time', formatTime(Util.toFloat(Dom.storage.fast_lap_time)));
      }
    });

    window.addEventListener('resize', function () {
      reset({ width: window.innerWidth, height: window.innerHeight });
    });

    function reset(options) {
      options       = options || {};
      canvas.width  = width  = Util.toInt(options.width,          width);
      canvas.height = height = Util.toInt(options.height,         height);
      lanes                  = Util.toInt(options.lanes,          lanes);
      roadWidth              = Util.toInt(options.roadWidth,      roadWidth);
      cameraHeight           = Util.toInt(options.cameraHeight,   cameraHeight);
      drawDistance           = Util.toInt(options.drawDistance,   drawDistance);
      fogDensity             = Util.toInt(options.fogDensity,     fogDensity);
      fieldOfView            = Util.toInt(options.fieldOfView,    fieldOfView);
      segmentLength          = Util.toInt(options.segmentLength,  segmentLength);
      rumbleLength           = Util.toInt(options.rumbleLength,   rumbleLength);
      cameraDepth            = 1 / Math.tan((fieldOfView/2) * Math.PI/180);
      playerZ                = (cameraHeight * cameraDepth);
      resolution             = height/480;
      refreshTweakUI();

      if ((segments.length==0) || (options.segmentLength) || (options.rumbleLength))
        resetRoad(); // only rebuild road when necessary
    }

    //=========================================================================
    // (tweak UI removed for the fullscreen race - reset() no longer needs to
    // sync any dev controls, so this is a no-op kept only because reset() calls it)
    //=========================================================================

    function refreshTweakUI() {}

    //=========================================================================
    // MONAD GRAND PRIX - setup flow: team count -> color -> countdown -> race
    //=========================================================================

    document.querySelectorAll('.count-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        showColorStep(parseInt(btn.getAttribute('data-count'), 10));
      });
    });

    function showColorStep(count) {
      teamCount = count;
      document.getElementById('setup-step-count').classList.add('hidden');

      var colorOptions = document.getElementById('color-options');
      colorOptions.innerHTML = '';
      TEAMS.slice(0, count).forEach(function (team) {
        var btn = document.createElement('button');
        btn.className   = 'color-btn team-' + team.id;
        btn.textContent = team.name;
        btn.addEventListener('click', function () { chooseTeam(team); });
        colorOptions.appendChild(btn);
      });

      document.getElementById('setup-step-color').classList.remove('hidden');
    }

    function chooseTeam(team) {
      playerTeam = team;
      updateTeamsLegend(teamCount, team.id);
      populateRaceCars(teamCount, team.id);

      RaceState.teams = TEAMS.slice(0, teamCount).map(function (t) {
        var teamState = Protocol.emptyTeamState(t.id);
        teamState.driverConnected = (t.id === team.id); // only the human has a connected driver for now
        return teamState;
      });

      beginCountdown();
    }

    function updateTeamsLegend(count, chosenTeamId) {
      TEAMS.forEach(function (team, index) {
        var el = document.querySelector('#teams .team-' + team.id);
        if (!el) return;
        el.style.display = (index < count) ? '' : 'none';
        if (team.id === chosenTeamId) el.textContent += ' (YOU)';
      });
    }

    function beginCountdown() {
      RaceState.status = 'COUNTDOWN';
      document.getElementById('setup-step-color').classList.add('hidden');

      var countdownEl = document.getElementById('setup-countdown');
      var valueEl      = document.getElementById('countdown-value');
      countdownEl.classList.remove('hidden');

      var n = 3;
      valueEl.textContent = n;
      var timer = setInterval(function () {
        n -= 1;
        if (n > 0) {
          valueEl.textContent = n;
          return;
        }
        valueEl.textContent = 'GO!';
        clearInterval(timer);
        setTimeout(function () {
          document.getElementById('setup-overlay').classList.add('hidden');
          RaceState.status = 'RACING';
        }, 600);
      }, 1000);
    }

  </script>
  <script>
    //=========================================================================
    // MONAD GRAND PRIX - LIVE MODE (?live=1): the race is driven by the server.
    //=========================================================================
    // Adds NO new physics. The server (protocol v1, shared/protocol/PROTOCOL.md) owns positions,
    // speeds, winner and memes; this block only draws the four team cars where RACE_STATE says
    // they are. Without ?live=1 nothing here runs and the local single-player demo is unchanged.
    // RACE_STATE is truth; BOOST / MEME_EVENT are only used for effects.
    var Live = (function () {
      if (!/[?&]live=1(&|$)/.test(location.search)) return { active: false };

      var GRID_OFFSETS = [-0.75, -0.25, 0.25, 0.75];
      var GRID_AHEAD   = 500;    // grid cars start this far ahead of the camera anchor (same as the idle preview grid)
      var CAMERA_BACK  = 700;    // camera sits this far behind the rearmost car
      var MAX_GAP      = 30000;  // on screen, gaps between cars saturate here (a whole race is one lap of road, far more than fits in view)
      var SMOOTH       = 12;     // per-second follow rate: hides the 20 Hz snapshot cadence
      var live = { active: true, state: null, targets: {}, seenActive: false, net: null, bannerTimer: null, ready: false, pending: null, hitFlash: {}, hitCooldown: {} };

      // Cosmetic-only side-swipe feedback: real progress stays 100% server-authoritative (per
      // PROTOCOL.md the server has no physics/collisions at all), this only flashes/shakes the
      // team's own quadrant for a moment when its car's screen box overlaps a traffic car's.
      function checkCollisions() {
        var now = Date.now(), n, car, carSeg, carW, s, seg, j, other, otherW, hit;
        for (n = 0; n < cars.length; n++) {
          car = cars[n];
          if (!car.team) continue;
          if (live.hitCooldown[car.team.id] && now < live.hitCooldown[car.team.id]) continue;
          carSeg = findSegment(car.z);
          carW = car.sprite.w * SPRITES.SCALE;
          hit = false;
          for (s = -1; s <= 1 && !hit; s++) {
            seg = segments[(carSeg.index + s + segments.length) % segments.length];
            for (j = 0; j < seg.cars.length; j++) {
              other = seg.cars[j];
              if (other.team) continue;
              otherW = other.sprite.w * SPRITES.SCALE;
              if (Util.overlap(car.offset, carW, other.offset, otherW, 0.85)) { hit = true; break; }
            }
          }
          if (hit) {
            live.hitCooldown[car.team.id] = now + 900; // don't re-trigger every frame while still touching
            live.hitFlash[car.team.id] = now + 350;    // visual flash duration
          }
        }
      }
      live.split = /[?&]split=1(&|$)/.test(location.search); // ?live=1&split=1: 4 independent per-team chase cameras instead of one shared view

      var overlay   = document.getElementById('setup-overlay');
      var countEl   = document.getElementById('setup-countdown');
      var valueEl   = document.getElementById('countdown-value');
      var netPill, banner, metrics, ranking;

      function el(tag, css, parent) {
        var e = document.createElement(tag);
        e.style.cssText = css;
        (parent || document.body).appendChild(e);
        return e;
      }

      function message(text, size) {
        document.getElementById('setup-step-count').classList.add('hidden');
        document.getElementById('setup-step-color').classList.add('hidden');
        countEl.classList.remove('hidden');
        valueEl.style.fontSize = size || '3em';
        valueEl.textContent = text;
        overlay.classList.remove('hidden');
      }

      function hideOverlay() { overlay.classList.add('hidden'); }

      // Chaos / meme reactions (visual only; CSS class on the canvas, no gameplay)
      var css = document.createElement('style');
      css.textContent =
        '@keyframes mgpShake { 0%{transform:translate(4px,-3px)} 25%{transform:translate(-5px,2px)} 50%{transform:translate(3px,4px)} 75%{transform:translate(-3px,-4px)} 100%{transform:translate(4px,-3px)} }' +
        '#canvas.mgp-chaos { animation: mgpShake 0.14s linear infinite; filter: saturate(1.6); }' +
        '@media (prefers-reduced-motion: reduce) { #canvas.mgp-chaos { animation: none; } }';
      document.head.appendChild(css);

      function showBanner(text) {
        if (!banner) banner = el('div', 'position:fixed;left:0;right:0;top:14%;text-align:center;z-index:6;font:900 3.2em Verdana,sans-serif;color:#fff;text-shadow:0 4px 14px #000,0 0 30px #f0f;pointer-events:none');
        banner.textContent = text;
        banner.style.display = 'block';
        clearTimeout(live.bannerTimer);
        live.bannerTimer = setTimeout(function () { banner.style.display = 'none'; }, 2500);
      }

      function chainText(s) {
        var m = s.metrics;
        // chain numbers are shown only as what they are: real (LIVE), clearly simulated (DEMO), or not at all (OFF)
        if (s.chainMode === 'LIVE') return 'MONAD TESTNET  tx sent ' + m.transactionsSent + ' / confirmed ' + m.transactionsConfirmed;
        if (s.chainMode === 'DEMO') return 'DEMO MODE (simulated chain)  tx ' + m.transactionsSent + ' / ' + m.transactionsConfirmed;
        return 'chain offline';
      }

      function renderMetrics(s) {
        if (!metrics) metrics = el('div', 'position:fixed;left:14px;bottom:14px;z-index:3;font:700 0.9em Verdana,sans-serif;color:#fff;text-shadow:0 1px 3px #000;background:rgba(0,0,0,0.45);padding:6px 10px;border-radius:6px;pointer-events:none');
        metrics.textContent = 'BOOSTS/S ' + Math.round(s.metrics.boostsPerSecond) + '   ' + chainText(s);
      }

      // Live ranking, P1..P4 by real race position (0..1) - the same number that decides the winner.
      function renderRanking(s) {
        if (!ranking) ranking = el('div', 'position:fixed;right:14px;bottom:14px;z-index:6;font:700 0.85em Verdana,sans-serif;color:#fff;text-shadow:0 1px 3px #000;background:rgba(0,0,0,0.45);padding:8px 10px;border-radius:6px;pointer-events:none;min-width:140px');
        var ranked = s.teams.slice().sort(function (a, b) { return b.position - a.position; });
        ranking.innerHTML = ranked.map(function (t, i) {
          var team = TEAMS.filter(function (x) { return x.id === t.id; })[0];
          var name = team ? team.name : String(t.id).toUpperCase();
          var color = team ? team.color : '#fff';
          return '<div style="display:flex;align-items:center;gap:6px;padding:1px 0">' +
            '<span style="opacity:0.8">P' + (i + 1) + '</span>' +
            '<span style="width:10px;height:10px;border-radius:50%;background:' + color + ';display:inline-block;flex:none"></span>' +
            '<span>' + name + '</span>' +
            '</div>';
        }).join('');
      }

      live.begin = function () {
        function place(car, z) {
          car.z = Util.increase(z, 0, trackLength);
          car.percent = Util.percentRemaining(car.z, segmentLength);
          findSegment(car.z).cars.push(car);
        }

        // the four team cars already exist from the idle preview grid: keep exactly those
        var teamCars = cars.filter(function (c) { return c.team; });
        segments.forEach(function (s) { s.cars = []; }); // clear stale refs (idle preview + any earlier race)
        cars = teamCars;
        cars.forEach(function (c, i) {
          c.d = GRID_AHEAD + playerZ;
          c.base = GRID_OFFSETS[i];
          c.offset = c.base;
          c.speed = 0;
          place(c, c.d);
        });

        addTrafficCars(150); // obstacle cars/trucks to dodge - same population as the local single-player mode

        live.ready = true;
        message('CONNECTING...', '2.4em');
      };

      function place(car, z) {
        var oldSegment = findSegment(car.z);
        car.z = Util.increase(z, 0, trackLength);
        car.percent = Util.percentRemaining(car.z, segmentLength);
        var newSegment = findSegment(car.z);
        if (oldSegment !== newSegment) {
          var i = oldSegment.cars.indexOf(car);
          if (i >= 0) oldSegment.cars.splice(i, 1);
          newSegment.cars.push(car);
        }
      }

      function applyState(s) {
        live.state = s;
        RaceState.status = s.status;
        RaceState.elapsed = s.elapsed;
        RaceState.teams = s.teams;

        s.teams.forEach(function (t) {
          var car = findCarByTeamId(t.id);
          if (!car) return;
          // full steering lock should be clearly visible: sweep most of the road width, not just a
          // quarter of it, while still keeping the car mostly on the drawn track (+-0.9 max) and
          // a touch of grid spread from its starting lane so 4 cars don't render on top of each other
          var laneOffset = Util.limit((car.base || 0) * 0.35 + t.steer * 0.75, -0.9, 0.9);
          live.targets[t.id] = { d: GRID_AHEAD + playerZ + t.position * trackLength, offset: laneOffset, speed: t.speed };
          var legend = document.querySelector('#teams .team-' + t.id);
          if (legend) legend.textContent = legend.getAttribute('data-name') + '  ' + t.boosters + ' boosting' + (t.driverConnected ? '  (driver)' : '  (no driver)');
        });

        document.getElementById('canvas').classList.toggle('mgp-chaos', s.status === 'CHAOS');
        renderMetrics(s);
        renderRanking(s);

        if (s.status === 'LOBBY') {
          if (live.seenActive) { location.href = MgpClient.link('/'); return; } // race was reset: back to the lobby screen
          message('WAITING FOR THE RACE TO START', '2em');
        } else if (s.status === 'COUNTDOWN') {
          live.seenActive = true;
          message(String(Math.max(1, Math.ceil(-s.elapsed))), '9em');
        } else if (s.status === 'FINISHED') {
          live.seenActive = true;
          var w = TEAMS.filter(function (t) { return t.id === s.winner; })[0];
          message((w ? w.name : String(s.winner).toUpperCase()) + ' WINS!', '3.2em');
        } else {
          live.seenActive = true;
          hideOverlay();
        }
      }

      // Called from update(dt) instead of the local physics.
      // Server positions are real progress (0..1 of the race). Cars are drawn relative to the leader with
      // gaps that grow with the real gap but saturate at MAX_GAP, so the whole field is always on screen
      // while the road still scrolls at the leader's real pace. Order and "who is ahead" are always exact.
      live.update = function (dt) {
        if (!live.ready) return;
        if (live.pending) { var p = live.pending; live.pending = null; applyState(p); }
        if (!live.state) return;
        var n, car, tgt, gap, k = Math.min(1, dt * SMOOTH), leadD = -Infinity, lead = null, maxVis = 0;
        for (n = 0; n < cars.length; n++) {
          car = cars[n];
          if (!car.team) continue; // traffic car - moved separately below, it has no race target
          tgt = live.targets[car.team.id];
          if (!tgt) continue;
          car.d      += (tgt.d - car.d) * k;
          car.offset += (tgt.offset - car.offset) * k;
          car.speed   = tgt.speed * maxSpeed / 2; // visual scroll speed only (real race progress is server-side and unaffected) - toned down a bit, felt too fast
          if (car.d > leadD) { leadD = car.d; lead = car; }
        }
        if (!lead) return;
        for (n = 0; n < cars.length; n++) {
          car = cars[n];
          if (!car.team || !live.targets[car.team.id]) continue;
          gap = leadD - car.d;
          car.vis = MAX_GAP * (1 - Math.exp(-gap / MAX_GAP));
          if (car.vis > maxVis) maxVis = car.vis;
          place(car, leadD - car.vis);
        }

        // ambient traffic: just drives forward at its own pace, same as the local mode's updateCars()
        for (n = 0; n < cars.length; n++) {
          car = cars[n];
          if (car.team) continue;
          place(car, car.z + car.speed * dt);
        }

        checkCollisions();

        var startPosition = position;
        position = Util.increase(leadD - maxVis - CAMERA_BACK - playerZ, 0, trackLength);
        speed = lead.speed;
        var seg = findSegment(position + playerZ);
        var move = position - startPosition; if (move < -trackLength / 2) move += trackLength;
        skyOffset  = Util.increase(skyOffset,  skySpeed  * seg.curve * move / segmentLength, 1);
        hillOffset = Util.increase(hillOffset, hillSpeed * seg.curve * move / segmentLength, 1);
        treeOffset = Util.increase(treeOffset, treeSpeed * seg.curve * move / segmentLength, 1);
        updateHud('speed', Math.round(lead.speed / maxSpeed * 190));
        updateHud('current_lap_time', formatTime(Math.max(0, live.state.elapsed)));
      };

      // ?live=1&split=1: draws the SAME scene four times, once per team, into the four
      // quadrants of the canvas - each as its own chase camera trailing that team's own
      // car. Reuses renderSingleView() untouched: only position/playerX/speed (the camera)
      // change between calls, plus a clip+scale so each pass lands in its own quadrant.
      live.renderSplit = function () {
        ctx.clearRect(0, 0, width, height);
        if (!live.ready || !live.state) return;

        var halfW = width / 2, halfH = height / 2;
        var slots = [ { x: 0, y: 0 }, { x: halfW, y: 0 }, { x: 0, y: halfH }, { x: halfW, y: halfH } ];
        var savedPosition = position, savedPlayerX = playerX, savedSpeed = speed;

        var now = Date.now();

        TEAMS.forEach(function (team, i) {
          var car = findCarByTeamId(team.id);
          var slot = slots[i];
          if (!car) return;

          var hitLeft = live.hitFlash[team.id] ? (live.hitFlash[team.id] - now) : 0;
          var hitting = hitLeft > 0;

          position = Util.increase(car.z - CAMERA_BACK - playerZ, 0, trackLength);
          playerX  = hitting ? (Math.random() - 0.5) * 0.25 : 0; // quick shake, cosmetic only
          speed    = car.speed;

          ctx.save();
          ctx.beginPath();
          ctx.rect(slot.x, slot.y, halfW, halfH);
          ctx.clip();
          ctx.translate(slot.x, slot.y);
          ctx.scale(halfW / width, halfH / height);
          renderSingleView();
          if (hitting) {
            ctx.fillStyle = 'rgba(229, 57, 53, ' + (0.35 * hitLeft / 350) + ')';
            ctx.fillRect(0, 0, width, height);
          }
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = hitting ? '#fff' : team.color;
          ctx.lineWidth = hitting ? 7 : 4;
          ctx.strokeRect(slot.x + 2, slot.y + 2, halfW - 4, halfH - 4);
          ctx.fillStyle = team.color;
          ctx.fillRect(slot.x, slot.y, 150, 36);
          ctx.fillStyle = (team.id === 'yellow') ? '#2a2a08' : '#fff';
          ctx.font = 'bold 20px Verdana, sans-serif';
          ctx.fillText(team.name, slot.x + 12, slot.y + 25);
          ctx.restore();
        });

        position = savedPosition;
        playerX  = savedPlayerX;
        speed    = savedSpeed;
      };

      // ---- connection ----
      function connect() {
        netPill = el('div', 'position:fixed;right:14px;top:10px;z-index:6;font:700 0.8em Verdana,sans-serif;color:#fff;background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:6px;pointer-events:none');
        TEAMS.forEach(function (t) { var e = document.querySelector('#teams .team-' + t.id); if (e) e.setAttribute('data-name', e.textContent.trim()); });
        live.net = MgpClient.connect({
          role: 'screen',
          onStatus: function (st) {
            netPill.textContent = st === 'online' ? 'LIVE' : st === 'connecting' ? 'CONNECTING...' : st === 'offline' ? 'OFFLINE - RECONNECTING...' : st.toUpperCase();
            netPill.style.background = st === 'online' ? 'rgba(20,140,60,0.8)' : 'rgba(160,30,30,0.8)';
            if (st === 'offline' && live.ready) message('RECONNECTING...', '2.4em');
          },
          onState: function (s) { live.pending = s; }, // applied on the next frame: RACE_STATE is the truth, latest one wins
          onEvent: function (e) {
            if (e.type === 'MEME_EVENT') showBanner(e.event.name + '!  (' + e.team.toUpperCase() + ')');
          }
        });
      }

      // wait until the racer assets are loaded and the road is built, then start
      var wait = setInterval(function () {
        if (window.racerReady) { clearInterval(wait); live.begin(); connect(); }
      }, 50);

      return live;
    })();
  </script>

</body>
</html>
