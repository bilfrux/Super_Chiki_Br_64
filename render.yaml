services:
  - type: web
    name: mgp-super-chiki-br-64
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_URL
        value: https://mgp-super-chiki-br-64.onrender.com
      # a car at speed=1 (fully boosted) finishes in this many seconds; default is 60,
      # shortened to target a ~40s demo race (worst case with zero boosting is still a
      # few minutes since speed is capped much lower without an active driver/boosters)
      - key: SECONDS_AT_SPEED_1
        value: "40"
