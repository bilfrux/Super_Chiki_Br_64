<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MONAD GRAND PRIX - Join</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0b12; color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      touch-action: manipulation;
    }
    .screen {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center; gap: 8px;
    }
    h1 { font-size: 1.6em; letter-spacing: 0.03em; margin: 0 0 4px; }
    p.subtitle { font-size: 1.1em; opacity: 0.8; margin: 0 0 8px; }
    #status-msg { font-size: 0.85em; opacity: 0.6; min-height: 1.4em; margin: 0 0 20px; }
    .teams {
      width: 100%; max-width: 420px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .team-btn {
      appearance: none; border: none; border-radius: 20px;
      padding: 22px 8px; font-size: 1.3em; font-weight: 700;
      color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; user-select: none; position: relative;
      transform: scale(1); transition: transform 0.08s ease-out, opacity 0.2s;
    }
    .team-btn:active { transform: scale(0.95); }
    .team-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .team-btn .emoji { font-size: 1.8em; }
    .team-btn .role-badge {
      font-size: 0.5em; font-weight: 900; letter-spacing: 0.06em;
      background: rgba(0,0,0,0.35); border-radius: 8px; padding: 3px 8px;
    }
    .team-red    { background: #E53935; }
    .team-blue   { background: #1E88E5; }
    .team-green  { background: #43A047; }
    .team-yellow { background: #FDD835; color: #2a2a08; text-shadow: none; }
    .team-yellow .role-badge { background: rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <div class="screen">
    <h1>🏁 MONAD GRAND PRIX</h1>
    <p class="subtitle">Choose your team</p>
    <p id="status-msg">Connecting…</p>

    <div class="teams">
      <button class="team-btn team-red"    data-team="red"    disabled><span class="emoji">🔴</span>RED<span class="role-badge" id="badge-red">…</span></button>
      <button class="team-btn team-blue"   data-team="blue"   disabled><span class="emoji">🔵</span>BLUE<span class="role-badge" id="badge-blue">…</span></button>
      <button class="team-btn team-green"  data-team="green"  disabled><span class="emoji">🟢</span>GREEN<span class="role-badge" id="badge-green">…</span></button>
      <button class="team-btn team-yellow" data-team="yellow" disabled><span class="emoji">🟡</span>YELLOW<span class="role-badge" id="badge-yellow">…</span></button>
    </div>
  </div>

  <script src="/game/net/mgp-client.js"></script>
  <script>
    var statusMsg = document.getElementById('status-msg');
    var teamState = { red: null, blue: null, green: null, yellow: null };

    function updateBadges() {
      Object.keys(teamState).forEach(function (id) {
        var t = teamState[id];
        var badge = document.getElementById('badge-' + id);
        if (!t || !badge) return;
        badge.textContent = t.driverConnected ? ('🙋 ' + t.boosters) : '🎮 NEEDS DRIVER';
      });
    }

    document.querySelectorAll('.team-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        var teamId = btn.getAttribute('data-team');
        var t = teamState[teamId];
        document.querySelectorAll('.team-btn').forEach(function (b) { b.disabled = true; });
        statusMsg.textContent = 'Joining ' + teamId.toUpperCase() + '…';

        // first person on a team is its driver; everyone after is a booster.
        // The server enforces this too (SEAT_TAKEN if we race someone), this
        // just picks the right page so nobody has to guess.
        var target = (t && !t.driverConnected) ? '/driver/?team=' : '/booster/?team=';
        window.location.href = target + encodeURIComponent(teamId);
      });
    });

    MgpClient.connect({
      role: 'screen',
      onStatus: function (s) {
        if (s === 'connecting') statusMsg.textContent = 'Connecting…';
        else if (s === 'offline') statusMsg.textContent = 'Reconnecting…';
      },
      onState: function (state) {
        (state.teams || []).forEach(function (t) { teamState[t.id] = t; });
        updateBadges();
        statusMsg.textContent = 'Tap your team to join!';
        document.querySelectorAll('.team-btn').forEach(function (b) { b.disabled = false; });
      }
    });
  </script>

</body>
</html>
