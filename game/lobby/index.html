<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SUPER CHIKI BR 64</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --p1: #ff3b3b; /* red   */
      --p2: #2f6bff; /* blue  */
      --p3: #23c552; /* green */
      --p4: #ffd23f; /* yellow */
    }

    html, body { margin: 0; padding: 0; height: 100%; background: #05010f; overflow: hidden; }

    /* the existing /test racer, untouched, shown as a dimmed background layer */
    #racer-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; z-index: 0;
      filter: blur(5px) saturate(1.3) brightness(0.4);
      transform: scale(1.08); /* hide the blur's edge fringe */
    }

    #scanlines {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px
      );
      mix-blend-mode: overlay;
    }
    #vignette {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      box-shadow: inset 0 0 22vw 4vw rgba(0,0,0,0.75);
    }

    #lobby {
      position: absolute; inset: 0; z-index: 3;
      background: radial-gradient(ellipse at 50% 20%, rgba(50, 10, 90, 0.8), rgba(5, 1, 15, 0.95) 70%);
      color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center; padding: 24px; box-sizing: border-box;
    }
    #lobby.hidden { display: none; }

    .stripe {
      width: 100%; height: 14px; flex: 0 0 auto;
      background-image: repeating-linear-gradient(45deg, #111 0 18px, #eee 18px 36px);
      box-shadow: 0 0 18px rgba(0,0,0,0.6);
    }
    .stripe.top    { position: absolute; top: 0; left: 0; z-index: 3; }
    .stripe.bottom { position: absolute; bottom: 0; left: 0; z-index: 3; }

    .title-wrap { position: relative; margin: 6px 0 2px; }
    h1.title {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(2.4em, 8vw, 5.2em);
      line-height: 1;
      margin: 0;
      letter-spacing: 0.02em;
      color: var(--p4);
      -webkit-text-stroke: 3px #1a0630;
      text-shadow:
        0 3px 0 #c98f00,
        0 6px 0 #8f6400,
        0 10px 0 rgba(0,0,0,0.5),
        0 0 24px rgba(255, 210, 63, 0.55);
      transform: rotate(-2deg);
      animation: bob 2.4s ease-in-out infinite;
    }
    h1.title .accent { color: var(--p1); -webkit-text-stroke: 3px #1a0630; }
    @keyframes bob {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50%      { transform: rotate(-2deg) translateY(-6px); }
    }

    .subtitle {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.55em, 1.6vw, 0.85em);
      letter-spacing: 0.12em;
      color: #9fe8ff;
      text-shadow: 0 0 10px rgba(159,232,255,0.7);
      margin: 0 0 4px;
    }

    .scan-to-join {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.75em, 2.2vw, 1.15em);
      letter-spacing: 0.08em;
      color: #fff;
      margin: 0;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }

    #qrcode-frame {
      background: linear-gradient(160deg, #3a1d70, #1a0a3a);
      padding: 14px;
      border-radius: 18px;
      border: 4px solid #ffd23f;
      box-shadow: 0 0 0 4px #1a0630, 0 10px 26px rgba(0,0,0,0.55), 0 0 30px rgba(255,210,63,0.25);
    }
    #qrcode { background: #fff; padding: 12px; border-radius: 10px; line-height: 0; }

    .join-url {
      margin: 0; font-family: "Courier New", monospace; font-weight: 800;
      font-size: 1.35em; letter-spacing: 0.02em; color: #ffd23f;
      text-shadow: 0 2px 0 rgba(0,0,0,0.5); word-break: break-all; text-align: center;
    }
    .join-warn {
      margin: 0; max-width: 34em; text-align: center; font-weight: 700;
      color: #fff; background: #b3261e; border-radius: 8px; padding: 6px 12px;
    }
    .join-warn[hidden] { display: none; }

    .hint {
      font-size: 1em; opacity: 0.8; margin: 0;
      font-weight: 600; letter-spacing: 0.02em;
    }

    .team-counts { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .team-count {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.25em; font-weight: 800;
      padding: 10px 18px; border-radius: 10px; color: #fff;
      border: 3px solid #1a0630;
      box-shadow: 0 4px 0 rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.25);
      text-shadow: 0 2px 0 rgba(0,0,0,0.35);
      min-width: 140px; justify-content: space-between;
    }
    .team-red    { background: var(--p1); }
    .team-blue   { background: var(--p2); }
    .team-green  { background: var(--p3); }
    .team-yellow { background: var(--p4); color: #2a2a08; text-shadow: none; }

    .composition { display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
    .driver-icon { opacity: 0.25; filter: grayscale(1); transition: opacity 0.2s, filter 0.2s; }
    .driver-icon.active { opacity: 1; filter: none; }

    #start-race-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.7em, 2vw, 1em);
      letter-spacing: 0.05em;
      color: #1a0630;
      background: var(--p4);
      border: 4px solid #1a0630;
      border-radius: 14px;
      padding: 16px 34px;
      margin-top: 6px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8f6400, 0 10px 22px rgba(0,0,0,0.5);
    }
    #start-race-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8f6400; }
    #start-race-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stars span {
      position: absolute; z-index: 3; pointer-events: none;
      color: #ffe98a; font-size: 1.4em;
      text-shadow: 0 0 8px rgba(255,233,138,0.8);
      animation: twinkle 2.6s ease-in-out infinite;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
  </style>
</head>
<body>

  <!-- existing racer engine, embedded as-is (no modification to /test) -->
  <iframe id="racer-bg" src="/test/v5.teams.html"></iframe>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div class="stripe top"></div>
  <div class="stripe bottom"></div>

  <div class="stars">
    <span style="top:12%; left:10%; animation-delay:0s;">★</span>
    <span style="top:20%; left:85%; animation-delay:0.6s;">★</span>
    <span style="top:75%; left:8%;  animation-delay:1.1s;">★</span>
    <span style="top:80%; left:90%; animation-delay:1.6s;">★</span>
    <span style="top:8%;  left:50%; animation-delay:2s;">★</span>
  </div>

  <div id="lobby">
    <p class="subtitle">🏁 MONAD BLITZ PARIS PRESENTS 🏁</p>

    <div class="title-wrap">
      <h1 class="title">SUPER<br>CHIKI <span class="accent">BR</span> 64</h1>
    </div>

    <p class="scan-to-join">SCAN TO JOIN</p>

    <div id="qrcode-frame"><div id="qrcode"></div></div>
    <p id="join-url" class="join-url">…</p>
    <p id="join-warn" class="join-warn" hidden></p>

    <p class="hint">📱 Choose your team on your phone</p>

    <div class="team-counts">
      <div class="team-count team-red">
        <span>🔴 RED</span>
        <span class="composition"><span class="driver-icon" id="driver-red">🎮</span>🙋<span id="count-red">0</span></span>
      </div>
      <div class="team-count team-blue">
        <span>🔵 BLUE</span>
        <span class="composition"><span class="driver-icon" id="driver-blue">🎮</span>🙋<span id="count-blue">0</span></span>
      </div>
      <div class="team-count team-green">
        <span>🟢 GREEN</span>
        <span class="composition"><span class="driver-icon" id="driver-green">🎮</span>🙋<span id="count-green">0</span></span>
      </div>
      <div class="team-count team-yellow">
        <span>🟡 YELLOW</span>
        <span class="composition"><span class="driver-icon" id="driver-yellow">🎮</span>🙋<span id="count-yellow">0</span></span>
      </div>
    </div>

    <button id="start-race-btn">🏁 LANCER LA PARTIE</button>
  </div>

  <script src="/shared/protocol/events.js"></script>
  <script src="/game/net/mgp-client.js"></script>
  <script src="/game/lobby/vendor/qrcode.min.js"></script>
  <script>
    // The QR must encode an address PHONES can reach. The server knows it (PUBLIC_URL if set, otherwise this
    // machine's best Wi-Fi/LAN address) and returns it from /api/join - so it is never "localhost" just because
    // the big screen happened to open http://localhost:8080/. The team picker lives at <that base>/join.
    var joinTextEl = document.getElementById('join-url');
    var joinWarnEl = document.getElementById('join-warn');
    var qr = null;

    function showJoin(joinUrl) {
      joinTextEl.textContent = joinUrl; // shown in full (with http/https) so it can be typed by hand
      if (!qr) qr = new QRCode(document.getElementById('qrcode'), { text: joinUrl, width: 200, height: 200 });
      else { qr.clear(); qr.makeCode(joinUrl); }
    }

    fetch(MgpClient.serverBase() + '/api/join')
      .then(function (r) { return r.json(); })
      .then(function (info) {
        // /api/join returns the Booster URL (<base><boosterPath>); the team picker is <base>/join
        var base = info.joinUrl.slice(0, info.joinUrl.length - info.boosterPath.length);
        showJoin(base + '/join');
        if (info.source === 'LOCALHOST') {
          joinWarnEl.hidden = false;
          joinWarnEl.textContent = 'No network address found - phones cannot reach this. Join Wi-Fi or set PUBLIC_URL.';
        }
      })
      .catch(function () {
        // Server unreachable (or a static host): fall back to this page's own address, but warn if it cannot work for phones
        var base = MgpClient.serverBase();
        showJoin(base + '/join');
        if (/\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/.test(base)) {
          joinWarnEl.hidden = false;
          joinWarnEl.textContent = 'This address only works on this computer. Open this page using the Wi-Fi address instead.';
        }
      });

    // Live team counts come from the server's RACE_STATE. When the operator starts the race
    // (status leaves LOBBY) this screen hands over to the race screen.
    MgpClient.connect({
      role: 'screen',
      onState: function (state) {
        (state.teams || []).forEach(function (team) {
          var countEl  = document.getElementById('count-' + team.id);
          var driverEl = document.getElementById('driver-' + team.id);
          if (countEl)  countEl.textContent = team.boosters;
          if (driverEl) driverEl.classList.toggle('active', !!team.driverConnected);
        });
        if (state.status !== 'LOBBY') window.location.href = MgpClient.link('/test/v5.teams.html?live=1&split=1');
      }
    });

    // Starts the race (admin-only, PROTOCOL.md CONTROL). Asks for the operator's
    // ADMIN_KEY once and remembers it locally on this device only.
    document.getElementById('start-race-btn').addEventListener('click', function () {
      var btn = this;
      var key = localStorage.getItem('mgp.admin.key')
        || new URLSearchParams(location.search).get('key')
        || window.prompt('Operator key to start the race:');
      if (!key) return;

      btn.disabled = true;
      btn.textContent = 'STARTING…';

      var admin = MgpClient.connect({
        role: 'admin',
        adminKey: key,
        onStatus: function (s, detail) {
          if (s === 'online') {
            localStorage.setItem('mgp.admin.key', key);
            admin.send({ type: 'CONTROL', action: 'START' });
            // the onState handler above redirects everyone (incl. this screen) once status leaves LOBBY
          } else if (s === 'error') {
            localStorage.removeItem('mgp.admin.key');
            btn.disabled = false;
            btn.textContent = '🏁 LANCER LA PARTIE';
            window.alert('Could not start the race: ' + (detail.message || detail.code || 'unknown error'));
          }
        }
      });
    });
  </script>

</body>
</html>
