<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MONAD GRAND PRIX - Driver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0b12; color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      touch-action: manipulation; user-select: none;
    }
    .screen {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 20px; text-align: center; gap: 18px;
    }
    h1 { font-size: 1.6em; letter-spacing: 0.03em; margin: 0; }
    .subtitle { font-size: 1.1em; opacity: 0.85; margin: 0 0 10px; }

    #start-btn {
      appearance: none; border: none; border-radius: 18px;
      background: #E53935; color: #fff; font-size: 1.3em; font-weight: 800;
      letter-spacing: 0.05em; padding: 22px 40px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.35);
      cursor: pointer;
    }
    #start-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.25); }

    #status { font-size: 1em; opacity: 0.75; min-height: 1.4em; }

    #indicator-wrap { display: none; width: 100%; max-width: 420px; }
    #indicator-wrap.visible { display: block; }

    .labels { display: flex; justify-content: space-between; font-size: 0.85em; opacity: 0.7; letter-spacing: 0.05em; margin-bottom: 8px; }

    .track { position: relative; height: 14px; background: #23232f; border-radius: 7px; margin: 0 10px; }
    .track::before { content: ''; position: absolute; left: 50%; top: -6px; width: 2px; height: 26px; background: #444; transform: translateX(-50%); }
    .dot {
      position: absolute; top: 50%; left: 50%;
      width: 34px; height: 34px; margin-left: -17px; margin-top: -17px;
      background: #43A047; border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      transition: left 0.05s linear, background-color 0.15s ease;
    }

    #value-readout { margin-top: 16px; font-size: 1.1em; font-variant-numeric: tabular-nums; opacity: 0.9; }
    #value-readout strong { font-size: 1.3em; }

    #recalibrate-btn {
      margin-top: 22px; background: none; border: 1px solid #444; color: #ccc;
      border-radius: 10px; padding: 10px 18px; font-size: 0.95em; cursor: pointer;
    }

    #fallback { display: none; font-size: 1.1em; color: #FDD835; max-width: 340px; line-height: 1.5; }
    #fallback.visible { display: block; }

    /* touch steering fallback: two big hold-to-steer zones */
    #touch-zones { display: none; width: 100%; max-width: 460px; gap: 12px; }
    #touch-zones.visible { display: flex; }
    .zone {
      flex: 1; height: 34vh; min-height: 170px; border-radius: 22px; border: 0;
      color: #fff; font: 900 1.35em/1.2 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: 0.04em;
      background: #1E88E5; box-shadow: 0 8px 0 rgba(0,0,0,0.3);
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px;
    }
    #zone-right { background: #E53935; }
    .zone.active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); filter: brightness(1.35); }
    #mode-btn { background: none; border: 1px solid #555; color: #ccc; border-radius: 10px; padding: 8px 16px; font-size: 0.9em; cursor: pointer; }

    #rotate-hint { display: none; }
    @media (orientation: portrait) {
      #rotate-hint {
        display: flex; align-items: center; gap: 10px; justify-content: center;
        background: #FDD835; color: #1a1a00; font-weight: 700; font-size: 0.95em;
        border-radius: 12px; padding: 10px 16px; margin: 0 0 4px;
      }
      #rotate-hint .icon { font-size: 1.4em; animation: rotate-hint-spin 1.6s ease-in-out infinite; }
    }
    @keyframes rotate-hint-spin {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    #axis-btn { background: #263238; border: 1px solid #555; color: #fff; border-radius: 10px; padding: 10px 18px; font-size: 0.95em; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="screen">
    <h1>🏎️ MONAD GRAND PRIX</h1>
    <p class="subtitle">YOUR PHONE IS YOUR STEERING WHEEL</p>
    <div id="rotate-hint"><span class="icon">📱</span> Turn your phone sideways for the best feel</div>

    <button id="start-btn">START DRIVER</button>
    <p id="status"></p>
    <p id="net-status" style="font-size:0.95em;min-height:1.4em;opacity:0.9"></p>

    <div id="indicator-wrap">
      <div class="labels"><span>LEFT</span><span>CENTER</span><span>RIGHT</span></div>
      <div class="track"><div class="dot" id="dot"></div></div>
      <div id="value-readout">steering: <strong id="value-text">0.00</strong></div>
      <button id="recalibrate-btn">Recalibrate center</button>
    </div>

    <p id="fallback">Gyroscope unavailable — steer with the touch zones</p>

    <div id="touch-zones">
      <button class="zone" id="zone-left" type="button">◀<br>STEER LEFT</button>
      <button class="zone" id="zone-right" type="button">STEER RIGHT<br>▶</button>
    </div>
    <button id="mode-btn" type="button">Use touch steering</button>
    <button id="axis-btn" type="button">Holding it: PORTRAIT (tap if car won't turn)</button>
  </div>

  <script src="/driver/gyro/gyroscope-steering.js"></script>
  <script src="/game/net/mgp-client.js"></script>
  <script>
    var dot            = document.getElementById('dot');
    var valueText      = document.getElementById('value-text');
    var statusEl       = document.getElementById('status');
    var indicatorWrap  = document.getElementById('indicator-wrap');
    var fallbackEl     = document.getElementById('fallback');
    var startBtn       = document.getElementById('start-btn');
    var recalibrateBtn = document.getElementById('recalibrate-btn');

    var gotReading = false; // true as soon as a single real orientation reading has arrived

    // Connection to the server (protocol v1, /ws on the same origin; ?server=https://host overrides).
    // Steering is sent as DRIVER_STEER (<= 30 Hz); the server owns the car, this page only sends the number.
    var netStatusEl = document.getElementById('net-status');
    var params = new URLSearchParams(location.search);
    var net = MgpClient.connect({
      role: 'driver',
      team: params.get('team') || undefined,
      onStatus: function (s, detail) {
        if (s === 'online') netStatusEl.textContent = 'Connected - you drive the ' + String(detail.team).toUpperCase() + ' car';
        else if (s === 'connecting') netStatusEl.textContent = 'Connecting to the race...';
        else if (s === 'offline') netStatusEl.textContent = 'Connection lost - reconnecting...';
        else if (s === 'seat-taken') netStatusEl.textContent = 'That driver seat is taken. Try another team: ?team=blue';
        else if (s === 'replaced') netStatusEl.textContent = 'Opened on another device or tab.';
        else if (s === 'outdated') netStatusEl.textContent = 'This page is out of date. Reload it.';
      }
    });

    // Two ways to steer, one output. 'gyro' = phone tilt (calibrated, with dead zone and smoothing in
    // GyroscopeSteering). 'touch' = hold the LEFT / RIGHT zones (used when the gyroscope cannot work:
    // plain http on a phone, no sensor, permission refused). Both end in output(value) -> DRIVER_STEER (<= 30 Hz).
    var mode = 'gyro';          // 'gyro' | 'touch'
    var autoTouch = false;      // touch mode was chosen automatically (so a late gyro reading may switch back)
    var modeBtn = document.getElementById('mode-btn');
    var touchZones = document.getElementById('touch-zones');

    function output(value) {
      net.steer(value);
      indicatorWrap.classList.add('visible');
      renderIndicator(value);
    }

    // The gyroscope module calls set(); the racer-style interface is kept.
    var SteeringInput = {
      value: 0,
      set: function (value) {
        gotReading = true;
        if (mode === 'touch') {
          if (!autoTouch) return;        // the driver chose touch on purpose: ignore the gyro
          setMode('gyro');               // a real reading arrived after an automatic fallback: it works after all
        }
        this.value = value;
        fallbackEl.classList.remove('visible');
        output(value);
      }
    };

    var touch = { left: false, right: false, target: 0, value: 0, raf: 0 };
    function touchLoop() {
      touch.raf = 0;
      if (mode !== 'touch') return;
      touch.target = (touch.left ? -1 : 0) + (touch.right ? 1 : 0);
      var next = touch.value + (touch.target - touch.value) * 0.25;      // short ramp: no jerk when a finger lands
      if (Math.abs(next - touch.target) < 0.02) next = touch.target;
      if (next !== touch.value) { touch.value = next; SteeringInput.value = next; output(next); }
      if (touch.value !== touch.target) touch.raf = requestAnimationFrame(touchLoop);
    }
    function touchKick() { if (!touch.raf) touch.raf = requestAnimationFrame(touchLoop); }

    function bindZone(id, side) {
      var el = document.getElementById(id);
      function down(e) { e.preventDefault(); touch[side] = true; el.classList.add('active'); touchKick(); }
      function up(e) { if (e) e.preventDefault(); touch[side] = false; el.classList.remove('active'); touchKick(); }
      el.addEventListener('pointerdown', down);
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { el.addEventListener(n, up); });
      el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    }
    bindZone('zone-left', 'left');
    bindZone('zone-right', 'right');
    window.addEventListener('keydown', function (e) { // desktop testing
      if (e.key === 'ArrowLeft') { touch.left = true; touchKick(); } else if (e.key === 'ArrowRight') { touch.right = true; touchKick(); }
    });
    window.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft') { touch.left = false; touchKick(); } else if (e.key === 'ArrowRight') { touch.right = false; touchKick(); }
    });

    function setMode(m, note, auto) {
      mode = m;
      autoTouch = m === 'touch' && !!auto;
      touchZones.classList.toggle('visible', m === 'touch');
      modeBtn.textContent = m === 'touch' ? 'Use gyroscope' : 'Use touch steering';
      touch.left = touch.right = false;
      if (m === 'touch') {
        indicatorWrap.classList.add('visible');
        renderIndicator(touch.value);
        if (note) { fallbackEl.textContent = note; fallbackEl.classList.add('visible'); }
      } else {
        fallbackEl.classList.remove('visible');
        touch.value = 0;
        output(0);
      }
    }
    modeBtn.addEventListener('click', function () {
      if (mode === 'touch') { gotReading = false; setMode('gyro'); } else setMode('touch', null, false);
    });

    // The gyroscope only works on secure pages (https) in modern phone browsers.
    var canUseGyro = window.isSecureContext !== false;

    function renderIndicator(value) {
      var pct = (value + 1) / 2 * 100; // -1..1 -> 0%..100%
      dot.style.left = pct + '%';
      dot.style.backgroundColor = Math.abs(value) < 0.08 ? '#43A047' : '#1E88E5';
      valueText.textContent = value.toFixed(2);
    }

    function showFallback(message) {
      statusEl.textContent = '';
      setMode('touch', message || 'Gyroscope unavailable - steer with the touch zones', true);
    }

    // Best-effort initial guess only (screen orientation freezes under the phone's rotation
    // lock, a common default, so this can be wrong - that's what the axis button below is for).
    var initialAxisMode = (window.matchMedia && window.matchMedia('(orientation: landscape)').matches) ? 'landscape' : 'portrait';
    var gyro = GyroscopeSteering.create(SteeringInput, { axisMode: initialAxisMode });

    var axisBtn = document.getElementById('axis-btn');
    var AXIS_CYCLE = ['portrait', 'landscape', 'landscape-flip'];
    var AXIS_LABEL = { portrait: 'PORTRAIT', landscape: 'LANDSCAPE', 'landscape-flip': 'LANDSCAPE (flipped)' };
    function renderAxisBtn() { axisBtn.textContent = 'Holding it: ' + AXIS_LABEL[gyro.getAxisMode()] + ' (tap if car won\'t turn)'; }
    renderAxisBtn();
    axisBtn.addEventListener('click', function () {
      var next = AXIS_CYCLE[(AXIS_CYCLE.indexOf(gyro.getAxisMode()) + 1) % AXIS_CYCLE.length];
      gyro.setAxisMode(next);
      renderAxisBtn();
    });

    startBtn.addEventListener('click', function () {
      startBtn.disabled = true;
      statusEl.textContent = 'Requesting gyroscope…';

      gyro.start().then(function () {
        statusEl.textContent = 'Listening — tilt your phone';

        // some browsers report DeviceOrientationEvent as supported but never
        // actually fire it (no sensor, or silently blocked) - detect that too.
        // If a reading ever does arrive later, SteeringInput.set() above recovers the UI.
        setTimeout(function () {
          if (!gotReading) showFallback();
        }, 2500);
      }).catch(function () {
        startBtn.disabled = false;
        showFallback();
      });
    });

    recalibrateBtn.addEventListener('click', function () {
      gyro.recalibrate();
    });

    if (!canUseGyro) {
      showFallback('Gyroscope needs HTTPS on phones - steer with the touch zones');
    } else if (!GyroscopeSteering.create(SteeringInput).isSupported()) {
      startBtn.disabled = true;
      showFallback();
    }
  </script>

</body>
</html>
