<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MONAD GRAND PRIX - Driver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0b12; color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      touch-action: manipulation; user-select: none;
    }
    .screen {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 20px; text-align: center; gap: 18px;
    }
    h1 { font-size: 1.6em; letter-spacing: 0.03em; margin: 0; }
    .subtitle { font-size: 1.1em; opacity: 0.85; margin: 0 0 10px; }

    #start-btn {
      appearance: none; border: none; border-radius: 18px;
      background: #E53935; color: #fff; font-size: 1.3em; font-weight: 800;
      letter-spacing: 0.05em; padding: 22px 40px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.35);
      cursor: pointer;
    }
    #start-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.25); }

    #status { font-size: 1em; opacity: 0.75; min-height: 1.4em; }

    #indicator-wrap { display: none; width: 100%; max-width: 420px; }
    #indicator-wrap.visible { display: block; }

    .labels { display: flex; justify-content: space-between; font-size: 0.85em; opacity: 0.7; letter-spacing: 0.05em; margin-bottom: 8px; }

    .track { position: relative; height: 14px; background: #23232f; border-radius: 7px; margin: 0 10px; }
    .track::before { content: ''; position: absolute; left: 50%; top: -6px; width: 2px; height: 26px; background: #444; transform: translateX(-50%); }
    .dot {
      position: absolute; top: 50%; left: 50%;
      width: 34px; height: 34px; margin-left: -17px; margin-top: -17px;
      background: #43A047; border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      transition: left 0.05s linear, background-color 0.15s ease;
    }

    #value-readout { margin-top: 16px; font-size: 1.1em; font-variant-numeric: tabular-nums; opacity: 0.9; }
    #value-readout strong { font-size: 1.3em; }

    #recalibrate-btn {
      margin-top: 22px; background: none; border: 1px solid #444; color: #ccc;
      border-radius: 10px; padding: 10px 18px; font-size: 0.95em; cursor: pointer;
    }

    #fallback { display: none; font-size: 1.1em; color: #FDD835; max-width: 340px; line-height: 1.5; }
    #fallback.visible { display: block; }
  </style>
</head>
<body>

  <div class="screen">
    <h1>🏎️ MONAD GRAND PRIX</h1>
    <p class="subtitle">YOUR PHONE IS YOUR STEERING WHEEL</p>

    <button id="start-btn">START DRIVER</button>
    <p id="status"></p>

    <div id="indicator-wrap">
      <div class="labels"><span>LEFT</span><span>CENTER</span><span>RIGHT</span></div>
      <div class="track"><div class="dot" id="dot"></div></div>
      <div id="value-readout">steering: <strong id="value-text">0.00</strong></div>
      <button id="recalibrate-btn">Recalibrate center</button>
    </div>

    <p id="fallback">Gyroscope unavailable — use keyboard</p>
  </div>

  <script src="/driver/gyro/gyroscope-steering.js"></script>
  <script>
    var dot            = document.getElementById('dot');
    var valueText      = document.getElementById('value-text');
    var statusEl       = document.getElementById('status');
    var indicatorWrap  = document.getElementById('indicator-wrap');
    var fallbackEl     = document.getElementById('fallback');
    var startBtn       = document.getElementById('start-btn');
    var recalibrateBtn = document.getElementById('recalibrate-btn');

    var gotReading = false; // true as soon as a single real orientation reading has arrived

    // Local test-mode target for THIS step only: same shape as the racer's real
    // SteeringInput (value + set(value)). Proves GyroscopeSteering -> .set(value)
    // works end-to-end without any network. A later (WebSocket) step will send
    // this same value to the real racer instead of just drawing it here.
    var SteeringInput = {
      value: 0,
      set: function (value) {
        this.value = value;
        gotReading = true;
        // self-heals even if the "no signal" fallback below already fired once -
        // any real reading, whenever it arrives, is proof the gyroscope works
        indicatorWrap.classList.add('visible');
        fallbackEl.classList.remove('visible');
        renderIndicator(value);
      }
    };

    function renderIndicator(value) {
      var pct = (value + 1) / 2 * 100; // -1..1 -> 0%..100%
      dot.style.left = pct + '%';
      dot.style.backgroundColor = Math.abs(value) < 0.08 ? '#43A047' : '#1E88E5';
      valueText.textContent = value.toFixed(2);
    }

    function showFallback(message) {
      fallbackEl.textContent = message || 'Gyroscope unavailable — use keyboard';
      fallbackEl.classList.add('visible');
      indicatorWrap.classList.remove('visible');
      statusEl.textContent = '';
    }

    var gyro = GyroscopeSteering.create(SteeringInput);

    startBtn.addEventListener('click', function () {
      startBtn.disabled = true;
      statusEl.textContent = 'Requesting gyroscope…';

      gyro.start().then(function () {
        statusEl.textContent = 'Listening — tilt your phone';

        // some browsers report DeviceOrientationEvent as supported but never
        // actually fire it (no sensor, or silently blocked) - detect that too.
        // If a reading ever does arrive later, SteeringInput.set() above recovers the UI.
        setTimeout(function () {
          if (!gotReading) showFallback();
        }, 2500);
      }).catch(function () {
        startBtn.disabled = false;
        showFallback();
      });
    });

    recalibrateBtn.addEventListener('click', function () {
      gyro.recalibrate();
    });

    if (!GyroscopeSteering.create(SteeringInput).isSupported()) {
      startBtn.disabled = true;
      showFallback();
    }
  </script>

</body>
</html>
